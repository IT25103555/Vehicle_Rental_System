# =========================================================
# Web-Based Vehicle Rental System - Backend Configuration
# =========================================================

server.port=8080

# ---- DATABASE ----
# Using H2 in FILE mode: a real SQL database that is written to disk
# at backend/data/vehicledb.mv.db, so your data survives restarts,
# with ZERO installation required (works immediately in IntelliJ).
spring.datasource.url=jdbc:h2:file:./data/vehicledb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console (view your tables in the browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- EMAIL (verification link, booking + payment notifications) ----
app.mail.enabled=true
app.backend-url=http://localhost:8080

# ---- Gmail ----
# 1) Turn on 2-Step Verification on the Gmail account: myaccount.google.com/security
# 2) Create an "App Password": myaccount.google.com/apppasswords (NOT your normal Gmail password)
# 3) Fill in YOUR_GMAIL_ADDRESS and YOUR_APP_PASSWORD below with the real values.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
